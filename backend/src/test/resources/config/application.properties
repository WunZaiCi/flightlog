# 测试安全网：即使测试类忘了继承 SqliteTestSupport，也绝不会写到项目根目录的 data/
# （config/application.properties 的优先级高于 classpath 根目录的 application.properties）
flightlog.data-dir=target/test-data/default

# 测试安全网：根目录 .env 里的真实 key 不能让测试去调用外部 API
# （config/ 下的配置优先级高于主配置和它导入的 .env；需要模拟的测试用 @DynamicPropertySource 指向 WireMock）
flightlog.aerodatabox.api-key=
flightlog.aerodatabox.base-url=http://127.0.0.1:9/external-api-disabled-in-tests
flightlog.gemini.api-key=
spring.ai.google.genai.api-key=
