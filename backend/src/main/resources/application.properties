spring.application.name=flightlog

# 只在本机 8000 端口运行；经 Tailscale 转发时识别 X-Forwarded-* 头
server.port=8000
# 默认只监听本机；Docker 容器里用环境变量 SERVER_ADDRESS=0.0.0.0 覆盖（compose 仍只绑定 127.0.0.1）
server.address=127.0.0.1
server.forward-headers-strategy=framework

# 读取项目根目录的 .env（密钥）；文件不存在时忽略
spring.config.import=optional:file:../.env[.properties]

# 错误统一返回 RFC 9457 ProblemDetail
spring.mvc.problemdetails.enabled=true

# 静态资源由 SpaWebConfig 统一注册（含前端路由回退和缓存策略），关闭 Spring Boot 默认的 /** 映射
spring.web.resources.add-mappings=false

# SQLite：数据库文件放在 data/（Docker 里挂载到 /app/data），启动时只由 Flyway 迁移，绝不删库重建
flightlog.data-dir=${FLIGHTLOG_DATA_DIR:../data}
spring.datasource.url=jdbc:sqlite:${flightlog.data-dir}/flightlog.db?journal_mode=WAL&foreign_keys=true&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 同一时间只允许一个写入，连接池设小
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 会话：Spring Session JDBC 存在 SQLite（表结构由 Flyway V2 管理），容器重启不用重新登录
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30d
server.servlet.session.cookie.name=FLIGHTLOG_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 不设置 cookie.secure：Spring Session 按请求是否 HTTPS 自动决定（经 Tailscale 的 HTTPS 访问加 Secure，本机 http 不加）

# AeroDataBox（经 API.Market，免费档）：key 为空时航班号查询功能禁用，手动录入照常可用
flightlog.aerodatabox.api-key=${AERODATABOX_API_KEY:}
flightlog.aerodatabox.base-url=https://prod.api.market/api/v1/aedbx/aerodatabox
flightlog.aerodatabox.key-header=x-magicapi-key
flightlog.aerodatabox.connect-timeout=5s
flightlog.aerodatabox.read-timeout=15s
# 「查不到」的结果缓存多久（航班计划可能之后才发布）；查到的结果永久缓存
flightlog.aerodatabox.not-found-ttl=24h

# Gemini（P7）：key 为空时 AI 解析功能禁用
flightlog.gemini.api-key=${GEMINI_API_KEY:}

# Spring AI（Gemini 免费档）。模型名经常变，不在代码里写死，统一从 LLM_MODEL 读取
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${LLM_MODEL:}
# 只用聊天模型；关掉用不到的图片、语音、向量等自动配置
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.moderation=none
# 图片上传（登机牌截图）大小上限
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
