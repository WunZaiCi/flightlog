spring.application.name=flightlog

# 只在本机 8000 端口运行；经 Tailscale 转发时识别 X-Forwarded-* 头
server.port=8000
# 默认只监听本机；Docker 容器里用环境变量 SERVER_ADDRESS=0.0.0.0 覆盖（compose 仍只绑定 127.0.0.1）
server.address=127.0.0.1
server.forward-headers-strategy=framework

# 读取项目根目录的 .env（密钥）；文件不存在时忽略
spring.config.import=optional:file:../.env[.properties]

# 错误统一返回 RFC 9457 ProblemDetail
spring.mvc.problemdetails.enabled=true

# 静态资源由 SpaWebConfig 统一注册（含前端路由回退和缓存策略），关闭 Spring Boot 默认的 /** 映射
spring.web.resources.add-mappings=false

# SQLite：数据库文件放在 data/（Docker 里挂载到 /app/data），启动时只由 Flyway 迁移，绝不删库重建
flightlog.data-dir=${FLIGHTLOG_DATA_DIR:../data}
spring.datasource.url=jdbc:sqlite:${flightlog.data-dir}/flightlog.db?journal_mode=WAL&foreign_keys=true&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite 同一时间只允许一个写入，连接池设小
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
