# Spring MVC 内置异常的中文 ProblemDetail 文案
#   problemDetail.<异常类名>        → detail（前端直接显示给用户）
#   problemDetail.title.<异常类名>  → title

problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=资源不存在

problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=请求方法不允许
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=不支持 {0} 请求方法

problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=不支持的内容类型
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=不支持的请求内容类型

problemDetail.title.org.springframework.web.HttpMediaTypeNotAcceptableException=无法提供该格式
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=无法提供请求的响应格式

problemDetail.title.org.springframework.web.bind.MissingServletRequestParameterException=缺少参数
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=缺少必填参数 {0}

# 类型转换失败：detail 的键固定用 TypeMismatchException，title 的键用实际异常类
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=参数格式错误
problemDetail.org.springframework.beans.TypeMismatchException=参数格式不正确

problemDetail.title.org.springframework.web.bind.MethodArgumentNotValidException=输入有误
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=输入内容有误，请检查后重试

problemDetail.title.org.springframework.web.method.annotation.HandlerMethodValidationException=输入有误
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=输入内容有误，请检查后重试

problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=请求格式错误
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=请求内容格式不正确

problemDetail.title.org.springframework.web.multipart.MaxUploadSizeExceededException=文件太大
problemDetail.org.springframework.web.multipart.MaxUploadSizeExceededException=上传的文件太大
